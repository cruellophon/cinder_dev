[workspace]
resolver = "2"
members = [
    "crates/harness-net",
    "crates/harness-store",
    "crates/harness-models",
    "crates/harness-providers",
    "crates/harness-tools",
    "crates/harness-core",
    "crates/cinder-gui",
    "bins/bumbo-app",
]

[workspace.package]
version = "0.6.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
flate2 = "1.0"
futures-util = "0.3"
hex = "0.4"
lopdf = "0.32"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.6"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp", "bmp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
