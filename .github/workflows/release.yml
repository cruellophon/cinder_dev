name: Release

on:
  push:
    tags:
      - "v*"
      - "beta*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. beta or v0.5.6)"
        required: true
        default: "beta"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS Release (Intel + Apple Silicon)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build Intel Mac binary (x86_64-apple-darwin)
        run: cargo build --release --bin cinder --target x86_64-apple-darwin
      - name: Build Apple Silicon binary (aarch64-apple-darwin)
        run: cargo build --release --bin cinder --target aarch64-apple-darwin
      - name: Package macOS .app bundles
        run: |
          VER="${{ inputs.tag || github.ref_name }}"
          bash scripts/bundle-macos-app.sh target/x86_64-apple-darwin/release/cinder dist intel "$VER"
          bash scripts/bundle-macos-app.sh target/aarch64-apple-darwin/release/cinder dist apple-silicon "$VER"
          ls -lh dist/
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/cinder-macos-intel.zip
            dist/cinder-macos-apple-silicon.zip

  build-linux:
    name: Linux Release (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & TLS system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libxdo-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build Linux release binary
        run: cargo build --release --bin cinder
      - name: Package Linux archive
        run: |
          VER="${{ inputs.tag || github.ref_name }}"
          bash scripts/package-linux.sh target/release/cinder dist "$VER"
          ls -lh dist/
      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/cinder-linux-x86_64.tar.gz

  build-windows:
    name: Windows Release (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build Windows release binary
        run: cargo build --release --bin cinder
      - name: Stage Windows standalone executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force target/release/cinder.exe dist/cinder.exe
          Get-Item dist/cinder.exe
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/cinder.exe

  publish-release:
    name: Publish Cross-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum cinder-macos-intel.zip cinder-macos-apple-silicon.zip cinder-linux-x86_64.tar.gz cinder.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Cinder ${{ inputs.tag || github.ref_name }}
          generate_release_notes: false
          files: |
            artifacts/cinder-macos-intel.zip
            artifacts/cinder-macos-apple-silicon.zip
            artifacts/cinder-linux-x86_64.tar.gz
            artifacts/cinder.exe
            artifacts/SHA256SUMS.txt
