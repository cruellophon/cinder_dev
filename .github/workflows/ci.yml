name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release --bin cinder

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI & TLS system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libxdo-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build --release --bin cinder

  macos:
    name: macOS (Intel x86_64 + Apple Silicon arm64)
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain & macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build Apple Silicon release binary (aarch64-apple-darwin)
        run: cargo build --release --bin cinder --target aarch64-apple-darwin
      - name: Build Intel Mac release binary (x86_64-apple-darwin)
        run: cargo build --release --bin cinder --target x86_64-apple-darwin
      - name: Verify macOS .app bundle packaging
        run: |
          bash scripts/bundle-macos-app.sh target/x86_64-apple-darwin/release/cinder dist intel ci
          bash scripts/bundle-macos-app.sh target/aarch64-apple-darwin/release/cinder dist apple-silicon ci
          ls -lh dist/
